---
- name: Verify Immich Kiosk
  hosts: all
  become: true
  gather_facts: false
  tasks:
    # Role defaults are not in scope in a verify playbook, but the version that
    # Renovate bumps lives in them and is what the running Kiosk is checked
    # against below. Only plain literal values may be read out of this namespace:
    # the defaults that are Jinja expressions would be evaluated against
    # variables that do not exist here.
    - name: Load the Immich Kiosk role defaults
      ansible.builtin.include_vars:
        file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
        name: immich_kiosk_defaults

    - name: Wait for Immich Kiosk service to become active (up to 180s)
      ansible.builtin.systemd:
        name: immich-kiosk.service
      register: immich_kiosk_service
      until: immich_kiosk_service.status.ActiveState == 'active'
      retries: 36
      delay: 5

    - name: Assert Immich Kiosk service is active
      ansible.builtin.assert:
        that: immich_kiosk_service.status.ActiveState == 'active'
        fail_msg: "immich-kiosk.service not active ({{ immich_kiosk_service.status.ActiveState }})"
        success_msg: "immich-kiosk.service is active"

    - name: Retrieve Immich Kiosk service log for debugging
      when: immich_kiosk_debug_service_enabled | bool
      ansible.builtin.command:
        cmd: journalctl -xeu immich-kiosk.service
      changed_when: false

    - name: Read the environment file this role rendered
      ansible.builtin.slurp:
        src: "/{{ immich_kiosk_defaults.immich_kiosk_identifier }}/env"
      register: immich_kiosk_env_file

    - name: Assert the environment file carries the configured Immich server
      ansible.builtin.assert:
        that: >-
          'KIOSK_IMMICH_URL=' ~ immich_kiosk_environment_variables_kiosk_immich_url
          in (immich_kiosk_env_file.content | b64decode)
        fail_msg: "The environment file does not point at {{ immich_kiosk_environment_variables_kiosk_immich_url }}"
        success_msg: "The environment file points at {{ immich_kiosk_environment_variables_kiosk_immich_url }}"

    # Inspecting the running container closes the gap between the file on disk
    # and the process: it proves the systemd unit actually handed the rendered
    # environment file to the container, rather than starting it bare.
    #
    # Queried via the docker CLI rather than community.docker.docker_container_info,
    # because the ansible-lint environment used by pre-commit does not have the
    # community.docker collection and would fail the syntax check. The full JSON
    # is parsed here rather than using `--format`, whose Go templating would
    # collide with Jinja.
    - name: Inspect the running Immich Kiosk container
      ansible.builtin.command:
        cmd: "docker inspect {{ immich_kiosk_defaults.immich_kiosk_identifier }}"
      register: immich_kiosk_container_inspect
      changed_when: false

    - name: Assert the configured Immich server reached the container environment
      ansible.builtin.assert:
        that: >-
          'KIOSK_IMMICH_URL=' ~ immich_kiosk_environment_variables_kiosk_immich_url
          in (immich_kiosk_container_inspect.stdout | from_json | first).Config.Env
        fail_msg: "The container environment does not carry the configured Immich server URL"
        success_msg: "The container environment carries the configured Immich server URL"

    # An Immich Kiosk that was not given an Immich server URL refuses to start at
    # all - it logs "Immich URL is missing" and exits non-zero, serving nothing.
    # A Kiosk answering here is therefore one that read and accepted the
    # configuration this role rendered, not merely a container that came up.
    - name: Wait for the Immich Kiosk health endpoint to respond (up to 10m)
      ansible.builtin.uri:
        url: "http://localhost:{{ immich_kiosk_container_http_host_bind_port }}/health"
        method: GET
        return_content: true
      register: immich_kiosk_health
      until: immich_kiosk_health.status == 200
      retries: 120
      delay: 5

    - name: Assert the Immich Kiosk health endpoint reports itself healthy
      ansible.builtin.assert:
        that: immich_kiosk_health.content | trim == 'OK'
        fail_msg: "The health endpoint answered {{ immich_kiosk_health.content | trim }} instead of OK"
        success_msg: "The health endpoint reports OK"

    # The slideshow page is rendered server-side from the loaded configuration:
    # its container element carries a request signature and a device identifier
    # that Kiosk computes per request, so a page containing them is proof of a
    # configured Kiosk rendering its real interface.
    - name: Retrieve the Immich Kiosk slideshow page
      ansible.builtin.uri:
        url: "http://localhost:{{ immich_kiosk_container_http_host_bind_port }}/"
        method: GET
        status_code: [200]
        return_content: true
      register: immich_kiosk_endpoint

    - name: Assert the Immich Kiosk slideshow page is rendered
      ansible.builtin.assert:
        that:
          - "'<title>Immich Kiosk</title>' in immich_kiosk_endpoint.content"
          - "'id=\"kiosk-container\"' in immich_kiosk_endpoint.content"
          - "'kiosk-device-id' in immich_kiosk_endpoint.content"
        fail_msg: "The Immich Kiosk slideshow page did not render as expected"
        success_msg: "The Immich Kiosk slideshow page is rendered"

    # Kiosk stamps the version it is running into a meta tag on every page it
    # serves, which is what ties a Renovate bump of immich_kiosk_version to the
    # image that actually ends up running.
    - name: Assert the running Immich Kiosk is the version this role installs
      when: immich_kiosk_verify_version_enabled | bool
      ansible.builtin.assert:
        that: >-
          '<meta name="version" content="' ~ immich_kiosk_defaults.immich_kiosk_version ~ '">'
          in immich_kiosk_endpoint.content
        fail_msg: "The running Immich Kiosk is not version {{ immich_kiosk_defaults.immich_kiosk_version }}"
        success_msg: "The running Immich Kiosk reports version {{ immich_kiosk_defaults.immich_kiosk_version }}"

    # A second, independent surface for the same version, on a page that is
    # templated differently from the slideshow one.
    - name: Retrieve the Immich Kiosk about page
      ansible.builtin.uri:
        url: "http://localhost:{{ immich_kiosk_container_http_host_bind_port }}/about"
        method: GET
        status_code: [200]
        return_content: true
      register: immich_kiosk_about

    - name: Assert the Immich Kiosk about page is rendered
      ansible.builtin.assert:
        that: "'<h1>Kiosk</h1>' in immich_kiosk_about.content"
        fail_msg: "The Immich Kiosk about page did not render as expected"
        success_msg: "The Immich Kiosk about page is rendered"

    - name: Assert the about page reports the version this role installs
      when: immich_kiosk_verify_version_enabled | bool
      ansible.builtin.assert:
        that: >-
          '>v' ~ immich_kiosk_defaults.immich_kiosk_version ~ '<'
          in immich_kiosk_about.content
        fail_msg: "The about page does not report version {{ immich_kiosk_defaults.immich_kiosk_version }}"
        success_msg: "The about page reports version {{ immich_kiosk_defaults.immich_kiosk_version }}"

    - name: Show Immich Kiosk verification summary
      ansible.builtin.debug:
        msg:
          - "Immich Kiosk systemd: {{ immich_kiosk_service.status.ActiveState }}"
          - "Immich Kiosk health: {{ immich_kiosk_health.content | trim }}"
          - "Immich Kiosk slideshow page: {{ immich_kiosk_endpoint.status }}"
          - "Immich Kiosk about page: {{ immich_kiosk_about.status }}"
          - "Version assertions enabled: {{ immich_kiosk_verify_version_enabled }}"
