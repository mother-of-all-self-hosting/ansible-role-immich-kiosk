---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: immich-kiosk-${MOLECULE_DISTRO:-ubuntu2604}-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        immich_kiosk_debug_service_enabled: false

        # The published container images are built from the tagged release, so the
        # version they report is the one this role pins and can be asserted against.
        immich_kiosk_verify_version_enabled: true

        # Variables for Immich Kiosk
        immich_kiosk_uid: 1000
        immich_kiosk_gid: 1000
        immich_kiosk_scheme: http
        immich_kiosk_hostname: localhost
        immich_kiosk_container_labels_traefik_enabled: false
        immich_kiosk_container_http_host_bind_port: 3000
        immich_kiosk_environment_variables_kiosk_immich_api_key: apikey
        immich_kiosk_environment_variables_kiosk_immich_url: https://example.com
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible
